[package]
name = "rustydb"
version = "1.0.0"
edition = "2024"
authors = ["Matthew Revill"]
description = "A high-performance in-memory key-value store with SQL support"
license = "Apache-2.0"

[dependencies]
dashmap = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = { version = "0.53", features = ["serde"] }
crc32fast = "1.4"
fs2 = "0.4"
semver = "1.0"
ureq = { version = "2.12", features = ["json"] }

# HTTP server for REST API
tokio = { version = "1.43", features = ["full"], optional = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
base64 = { version = "0.22", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["service", "tokio"], optional = true }

# Shared TLS and credential verification for server endpoints
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
getrandom = { version = "0.3", optional = true }
subtle = { version = "2.6", optional = true }
zeroize = { version = "1.8", optional = true }

[features]
default = []
server = [
    "tokio", "axum", "tower-http", "base64", "hyper", "hyper-util",
    "tokio-rustls", "getrandom", "subtle", "zeroize",
]

[dev-dependencies]
# For testing and benchmarking
criterion = "0.5"
num_cpus = "1.16"
tempfile = "3.15"
tokio = { version = "1.43", features = ["full"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[[bench]]
name = "kv_bench"
harness = false

[[bench]]
name = "stress_test_bench"
harness = false

[[bench]]
name = "sql_bench"
harness = false
