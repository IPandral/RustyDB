# RustyDB Docker Compose Configuration
# 
# Quick Start:
#   docker-compose up -d
#
# With custom settings:
#   docker-compose up -d --build
#
# View logs:
#   docker-compose logs -f
#
# Stop:
#   docker-compose down
#
# Stop and remove data:
#   docker-compose down -v

services:
  rustydb:
    build:
      context: .
      dockerfile: Dockerfile
    image: rustydb:latest
    container_name: rustydb
    restart: unless-stopped
    
    # =========================================================================
    # Port Configuration
    # =========================================================================
    # Map host port to container port
    # Bind published ports to loopback unless a different host address is configured.
    ports:
      - "${RUSTYDB_PUBLISH_HOST:-127.0.0.1}:${RUSTYDB_PORT:-8080}:8080"
      - "${RUSTYDB_PUBLISH_HOST:-127.0.0.1}:${RUSTYDB_WIRE_PORT:-3307}:3307"
    
    # =========================================================================
    # Environment Variables
    # =========================================================================
    environment:
      # Server binding (usually leave as 0.0.0.0 inside container)
      - RUSTYDB_HOST=0.0.0.0
      
      # Internal port (matches EXPOSE in Dockerfile)
      - RUSTYDB_PORT=8080

      # MySQL wire protocol port
      - RUSTYDB_WIRE_PORT=3307
      
      # TLS and authentication for both listeners
      - RUSTYDB_USERNAME=${RUSTYDB_USERNAME:?Set a username}
      - RUSTYDB_PASSWORD=${RUSTYDB_PASSWORD:?Set a password}
      - RUSTYDB_TLS_CERT=/tls/server.crt
      - RUSTYDB_TLS_KEY=/tls/server.key
      - RUSTYDB_TLS_CA=${RUSTYDB_CONTAINER_TLS_CA:-}
      - RUSTYDB_HEALTH_HOST=${RUSTYDB_HEALTH_HOST:-localhost}
      
      # Data directory inside container
      - RUSTYDB_DATA_DIR=/data
      
      # Storage mode:
      # - false: Persistent storage (data survives container restart)
      # - true:  Memory-only mode (faster, data lost on restart)
      - RUSTYDB_MEMORY_ONLY=${RUSTYDB_MEMORY_ONLY:-false}
      - RUSTYDB_PLAN_CACHE_CAPACITY=${RUSTYDB_PLAN_CACHE_CAPACITY:-256}
      - RUSTYDB_MEMORY_POOL_CAPACITY=${RUSTYDB_MEMORY_POOL_CAPACITY:-32}
      - RUSTYDB_BLOOM_FALSE_POSITIVE_RATE=${RUSTYDB_BLOOM_FALSE_POSITIVE_RATE:-0.01}
    
    # =========================================================================
    # Persistent Storage
    # =========================================================================
    # Named volume for data persistence
    # Remove this section if using RUSTYDB_MEMORY_ONLY=true
    volumes:
      - rustydb_data:/data
      - "${RUSTYDB_TLS_DIR:?Set the directory containing server.crt and server.key}:/tls:ro"
    
    # =========================================================================
    # Resource Limits (optional, uncomment to enable)
    # =========================================================================
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

# =============================================================================
# Volumes
# =============================================================================
volumes:
  rustydb_data:
    name: rustydb_data

# =============================================================================
# Networks (optional, for multi-container setups)
# =============================================================================
# networks:
#   default:
#     name: rustydb_network
